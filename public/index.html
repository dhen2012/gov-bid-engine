<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gov Bid Engine</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e2e1dc;--accent:#1f5f8b;--warn:#a1430f;--ok:#2d6a3e;--new:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1f1f1d;--ink:#ecebe6;--mute:#9b9a94;--line:#33332f;--accent:#6fb1de;--warn:#f0995c;--ok:#7cc48f;--new:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:960px){main{grid-template-columns:1fr 340px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.controls{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
button{cursor:pointer;background:var(--accent);color:#fff;border:0}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.q{grid-column:1/-1}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--mute);font-size:13px;gap:8px;flex-wrap:wrap}
.bar button{width:auto}
.bid{border-top:1px solid var(--line);padding:10px 0}
.bid a{color:var(--accent);font-weight:600;text-decoration:none}
.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;margin:2px 4px 0 0}
.newtag{color:var(--new);border-color:var(--new)}
.empty{padding:30px 0;text-align:center;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
.flag{color:var(--warn);font-weight:600}
.ok{color:var(--ok)}
h2{font-size:15px;margin:0 0 8px}
.err{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Gov Bid Engine</h1>
  <div class="sub" id="sub"></div>
</header>
<main>
  <section class="card">
    <div class="controls">
      <input class="q" id="q" type="search" placeholder="Search title, agency, description">
      <select id="state"><option value="">All states</option></select>
      <input id="naics" placeholder="NAICS code or prefix">
      <select id="ntype"><option value="">All notice types</option></select>
      <select id="status"><option value="open">Open</option><option value="">Any status</option><option value="closed">Closed</option></select>
      <select id="sort"><option value="posted">Posted newest</option><option value="due">Due soonest</option></select>
      <label class="meta" style="display:flex;align-items:center;gap:6px"><input id="newonly" type="checkbox" style="width:auto">New only</label>
    </div>
    <div class="bar"><span id="count"></span><span><button class="ghost" id="clear">Clear filters</button> <button id="csv">Download CSV</button></span></div>
    <div id="list"></div>
  </section>
  <aside class="card" id="statuspanel">
    <h2>Status</h2>
    <div id="runinfo" class="meta"></div>
    <table id="srcs"><thead><tr><th>Source</th><th>Channel</th><th>Today</th><th>7 day avg</th><th></th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:14px">Reach test (20 SC pages from GitHub)</h2>
    <div id="reach" class="meta"></div>
  </aside>
</main>
<script>
const DATA = {"bids":[],"status":{"built_at":"2026-11-13T11:28:48+00:00","last_run":{"start":"2026-11-13T11:28:31+00:00","end":"2026-11-13T11:28:48+00:00","trigger":"schedule","result":"ok","run_id":"43417324919"},"total_bids":0,"new_today":0,"sources":[{"source_id":"sam_gov","name":"SAM.gov Contract Opportunities","channel":"API (off until phase 1)","enabled":false,"today":null,"avg7":null,"flag":""},{"source_id":"sc_agency_pages","name":"SC agency own website bid pages (131 Opus verified)","channel":"page (off until phase 2)","enabled":false,"today":null,"avg7":null,"flag":""},{"source_id":"scbo","name":"South Carolina Business Opportunities","channel":"not collected (off until phase 3)","enabled":false,"today":null,"avg7":null,"flag":""}],"reach_test":{"run_at":"2026-11-13T11:28:48+00:00","counts":{"error":1,"loads":18,"turned away (challenge page)":1},"results":[{"entity_name":"Town of Moncks Corner","url":"https://monckscornersc.gov/business/current-bids-projects","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"North Charleston Sewer District","url":"https://ncsd.sc.gov/current-bid-opportunities/","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"Town of James Island","url":"https://www.jamesislandsc.us/current-bids","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"Town of Cheraw","url":"https://www.cheraw.com/government/business_opportunities.php","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"Charleston County Park and Recreation Commission","url":"https://www.ccprc.com/bids/","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"Town of Patrick","url":"https://www.townofpatrick.com/government/invitations_to_bid.php","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"City of Greenwood","url":"https://www.cityofgreenwoodsc.com/departments/procurement/current_projects_new.php","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"Town of Ravenel","url":"https://www.townofravenel.gov/rfps","outcome":"turned away (challenge page)","status":403,"listing_type":"html list"},{"entity_name":"Town of Andrews","url":"https://www.townofandrews.sc.gov/page/view-current-bidrfqrfp","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"City of Woodruff","url":"https://www.cityofwoodruff.com/business/bid_opportunities.php","outcome":"loads","status":200,"listing_type":"html list"},{"entity_name":"City of Goose Creek","url":"https://www.goosecreeksc.gov/government/vendor-solicitations","outcome":"loads","status":200,"listing_type":"pdf links"},{"entity_name":"McCormick County","url":"https://www.mccormickcountysc.org/how_do_i/rfp_rfq_request.php","outcome":"loads","status":200,"listing_type":"pdf links"},{"entity_name":"Bamberg County","url":"https://www.bambergcounty.sc.gov/projects-and-bids","outcome":"loads","status":200,"listing_type":"pdf links"},{"entity_name":"Town of Atlantic Beach","url":"https://www.townofatlanticbeachsc.com/page/Request%20for%20Proposal","outcome":"loads","status":200,"listing_type":"pdf links"},{"entity_name":"City of Chesnee","url":"https://www.cityofchesnee.org/bids","outcome":"loads","status":200,"listing_type":"pdf links"},{"entity_name":"City of Simpsonville","url":"https://www.simpsonville.com/rfps/","outcome":"loads","status":200,"listing_type":"news posts"},{"entity_name":"City of Pickens","url":"https://cityofpickens.com/category/request-for-proposal/","outcome":"error","status":null,"listing_type":"news posts"},{"entity_name":"Spartanburg School District 5","url":"https://www.spart5.net/page/procurement-services","outcome":"loads","status":200,"listing_type":"iframe or embedded portal"},{"entity_name":"Cherokee County School District","url":"https://www.cherokee1.org/page/solicitations","outcome":"loads","status":200,"listing_type":"iframe or embedded portal"},{"entity_name":"City of Dillon","url":"https://www.cityofdillonsc.gov/RFPsolicitations","outcome":"loads","status":200,"listing_type":"iframe or embedded portal"}]}}};
const $ = id => document.getElementById(id);
function fmt(t){ if(!t) return "never"; const d=new Date(t); return isNaN(d)?t:d.toLocaleString("en-US",{timeZone:"America/New_York",dateStyle:"medium",timeStyle:"short"})+" ET"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function daysLeft(d){ if(!d) return ""; const n=Math.ceil((new Date(d)-new Date())/864e5); return n<0?"closed":n+" days left"; }

if(!DATA){
  document.body.innerHTML='<header><h1>Gov Bid Engine</h1><p class="err">The bid data could not be loaded.</p></header>';
} else {
  const bids = DATA.bids || [], st = DATA.status || {};
  $("sub").textContent = `Last run ${fmt(st.last_run && st.last_run.end)} · ${st.total_bids||0} bids · ${st.new_today||0} new today`;
  const states=[...new Set(bids.map(b=>b.state).filter(Boolean))].sort();
  states.forEach(s=>$("state").add(new Option(s,s)));
  const types=[...new Set(bids.map(b=>b.notice_type).filter(Boolean))].sort();
  types.forEach(s=>$("ntype").add(new Option(s,s)));
  const ids=["q","state","naics","ntype","status","sort"];
  const params=new URLSearchParams(location.hash.slice(1));
  ids.forEach(i=>{ if(params.has(i)) $(i).value=params.get(i); });
  if(params.get("newonly")==="1") $("newonly").checked=true;
  let shown=[];
  function filter(){
    const q=$("q").value.trim().toLowerCase(), s=$("state").value, n=$("naics").value.trim(), t=$("ntype").value, stt=$("status").value, nw=$("newonly").checked;
    shown=bids.filter(b=>{
      if(s && b.state!==s) return false;
      if(t && b.notice_type!==t) return false;
      if(stt && (b.status||"open")!==stt) return false;
      if(nw && !b.is_new) return false;
      if(n && !(b.naics||[]).some(c=>String(c.code||c).startsWith(n))) return false;
      if(q && !`${b.title} ${b.agency} ${b.description_text||""}`.toLowerCase().includes(q)) return false;
      return true;
    });
    if($("sort").value==="due") shown.sort((a,b)=>String(a.due_at||"9").localeCompare(String(b.due_at||"9")));
    else shown.sort((a,b)=>String(b.posted_date||"").localeCompare(String(a.posted_date||"")));
    const p=new URLSearchParams(); ids.forEach(i=>{ if($(i).value) p.set(i,$(i).value); }); if(nw) p.set("newonly","1");
    history.replaceState(null,"","#"+p.toString());
    $("count").textContent=`${shown.length} of ${bids.length} bids`;
    const list=$("list");
    if(!bids.length){ list.innerHTML='<div class="empty">No bids collected yet. Collectors start in phase 1.</div>'; return; }
    if(!shown.length){ list.innerHTML='<div class="empty">No bids match these filters. <button class="ghost" onclick="clearAll()" style="width:auto">Clear filters</button></div>'; return; }
    list.innerHTML=shown.slice(0,500).map(b=>`<div class="bid">
      <a href="${esc(b.listing_url)}" target="_blank" rel="noopener">${esc(b.title)}</a>
      ${b.is_new?'<span class="tag newtag">New</span>':""}
      <div class="meta">${esc(b.agency)} · ${esc(b.state)}${b.county?" · "+esc(b.county):""} · ${esc(b.notice_type||"")}</div>
      <div class="meta">Posted ${esc(b.posted_date||"?")} · Due ${esc(b.due_at||"?")} ${daysLeft(b.due_at)}</div>
      <div>${(b.naics||[]).map(c=>`<span class="tag">${esc(c.code||c)} ${esc(c.name||"")}</span>`).join("")}${(b.sources||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
    </div>`).join("");
  }
  window.clearAll=function(){ ids.forEach(i=>$(i).value=""); $("status").value="open"; $("sort").value="posted"; $("newonly").checked=false; filter(); };
  ids.forEach(i=>$(i).addEventListener("input",filter)); $("newonly").addEventListener("change",filter);
  $("clear").onclick=clearAll;
  $("csv").onclick=()=>{
    const cols=["title","agency","state","county","notice_type","posted_date","due_at","listing_url"];
    const rows=[cols.join(",")].concat(shown.map(b=>cols.map(c=>`"${String(b[c]==null?"":b[c]).replace(/"/g,'""')}"`).join(",")));
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"})); a.download="gov-bids.csv"; a.click();
  };
  filter();
  const lr=st.last_run||{};
  $("runinfo").innerHTML=`Last run: ${fmt(lr.end)} (${esc(lr.trigger||"none")}, ${esc(lr.result||"no result")})<br>Page built: ${fmt(st.built_at)}`;
  $("srcs").querySelector("tbody").innerHTML=(st.sources||[]).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.channel)}</td><td>${s.today==null?"":s.today}</td><td>${s.avg7==null?"":s.avg7}</td><td class="flag">${esc(s.flag)}</td></tr>`).join("");
  const rt=st.reach_test||{}, c=rt.counts||{};
  $("reach").innerHTML = rt.run_at ? `Run ${fmt(rt.run_at)}: `+Object.entries(c).map(([k,v])=>`${esc(k)} ${v}`).join(", ")+
    `<table style="margin-top:6px"><tbody>${(rt.results||[]).map(r=>`<tr><td>${esc(r.entity_name)}</td><td class="${r.outcome==="loads"?"ok":"flag"}">${esc(r.outcome)}${r.status?" ("+r.status+")":""}</td></tr>`).join("")}</tbody></table>` : "Not run yet.";
}
</script>
</body>
</html>
