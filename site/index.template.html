<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gov Bid Engine</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e2e1dc;--accent:#1f5f8b;--warn:#a1430f;--ok:#2d6a3e;--new:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1f1f1d;--ink:#ecebe6;--mute:#9b9a94;--line:#33332f;--accent:#6fb1de;--warn:#f0995c;--ok:#7cc48f;--new:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px;display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:960px){main{grid-template-columns:1fr 340px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.controls{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
button{cursor:pointer;background:var(--accent);color:#fff;border:0}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.q{grid-column:1/-1}
.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 0;color:var(--mute);font-size:13px;gap:8px;flex-wrap:wrap}
.bar button{width:auto}
.bid{border-top:1px solid var(--line);padding:10px 0}
.bid a{color:var(--accent);font-weight:600;text-decoration:none}
.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;margin:2px 4px 0 0}
.newtag{color:var(--new);border-color:var(--new)}
details{margin-top:6px}summary{cursor:pointer;color:var(--mute);font-size:13px}dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 10px;font-size:13px;margin:6px 0}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.empty{padding:30px 0;text-align:center;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500}
.flag{color:var(--warn);font-weight:600}
.ok{color:var(--ok)}
h2{font-size:15px;margin:0 0 8px}
.err{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>Gov Bid Engine</h1>
  <div class="sub" id="sub"></div>
</header>
<main>
  <section class="card">
    <div class="controls">
      <input class="q" id="q" type="search" placeholder="Search title, agency, description">
      <select id="state"><option value="">All states</option></select>
      <input id="naics" placeholder="NAICS code or prefix">
      <select id="ntype"><option value="">All notice types</option></select>
      <select id="status"><option value="open">Open</option><option value="any">Any status</option><option value="closed">Closed</option></select>
      <select id="aside"><option value="">Any set aside</option></select>
      <select id="src"><option value="">All sources</option></select>
      <select id="sort"><option value="posted">Posted newest</option><option value="due">Due soonest</option></select>
      <label class="meta" style="display:flex;align-items:center;gap:6px"><input id="newonly" type="checkbox" style="width:auto">New only</label>
    </div>
    <div class="bar"><span id="count"></span><span><button class="ghost" id="clear">Clear filters</button> <button id="csv">Download CSV</button></span></div>
    <div id="list"></div>
  </section>
  <aside class="card" id="statuspanel">
    <h2>Status</h2>
    <div id="runinfo" class="meta"></div>
    <table id="srcs"><thead><tr><th>Source</th><th>Channel</th><th>Today</th><th>7 day avg</th><th></th></tr></thead><tbody></tbody></table>
    <h2 style="margin-top:14px">Reach test (20 SC pages from GitHub)</h2>
    <div id="reach" class="meta"></div>
  </aside>
</main>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
function fmt(t){ if(!t) return "never"; const d=new Date(t); return isNaN(d)?t:d.toLocaleString("en-US",{timeZone:"America/New_York",dateStyle:"medium",timeStyle:"short"})+" ET"; }
function safeUrl(u){ return /^https?:\/\//i.test(String(u||""))?u:"#"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function daysLeft(d){ if(!d) return ""; const n=Math.ceil((new Date(d.length===10?d+"T23:59:59":d)-new Date())/864e5); return n<0?"(closed)":`(${n} days left)`; }

function showStatus(st){
  const lr=st.last_run||{};
  $("sub").textContent = `Last run ${fmt(lr.end)} · ${st.open_bids==null?st.total_bids||0:st.open_bids} open bids · ${st.new_today||0} new today`;
  $("runinfo").innerHTML=`Last run: ${fmt(lr.end)} (${esc(lr.trigger||"none")}, ${esc(lr.result||"no result")})<br>Page built: ${fmt(st.built_at)}`;
  $("srcs").querySelector("tbody").innerHTML=(st.sources||[]).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.channel)}</td><td>${s.today==null?"":s.today}</td><td>${s.avg7==null?"":s.avg7}</td><td class="flag">${esc(s.flag)}</td></tr>`).join("");
  const rt=st.reach_test||{}, c=rt.counts||{};
  $("reach").innerHTML = rt.run_at ? `Run ${fmt(rt.run_at)}: `+Object.entries(c).map(([k,v])=>`${esc(k)} ${v}`).join(", ")+
    `<table style="margin-top:6px"><tbody>${(rt.results||[]).map(r=>`<tr><td>${esc(r.entity_name)}</td><td class="${r.outcome==="loads"?"ok":"flag"}">${esc(r.outcome)}${r.status?" ("+r.status+")":""}</td></tr>`).join("")}</tbody></table>` : "Not run yet.";
}

function detail(b){
  const rows=[["Solicitation number",b.solicitation_number],["Notice type",b.notice_type],["Status",b.status],["Posted",b.posted_date],["Due",b.due_at],["Set aside",b.set_aside],["City",b.city],["First seen",fmt(b.first_seen)]];
  const naics=(b.naics||[]).map(n=>`${esc(n.code)} ${esc(n.name||"")} (${esc(n.origin||"")})`).join("<br>");
  const links=(b.source_links||[]).map(l=>`<a href="${esc(safeUrl(l.listing_url))}" target="_blank" rel="noopener">${esc(l.source_id)} listing</a>${l.documents_url?` · <a href="${esc(safeUrl(l.documents_url))}" target="_blank" rel="noopener">documents</a> (${esc(l.documents_access)})`:""}`).join("<br>");
  return `<details><summary>Details</summary><dl>${rows.filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}<dt>NAICS</dt><dd>${naics||"none"}</dd><dt>Sources</dt><dd>${links}</dd>${b.description_text?`<dt>Description</dt><dd>${esc(b.description_text)}</dd>`:""}</dl></details>`;
}

function start(bids, st){
  const fill=(id,vals)=>[...new Set(vals.filter(Boolean))].sort().forEach(v=>$(id).add(new Option(v,v)));
  fill("state",bids.map(b=>b.state)); fill("ntype",bids.map(b=>b.notice_type)); fill("aside",bids.map(b=>b.set_aside));
  fill("src",bids.flatMap(b=>b.sources||[]));
  const ids=["q","state","naics","ntype","status","aside","src","sort"];
  const params=new URLSearchParams(location.hash.slice(1));
  ids.forEach(i=>{ if(params.has(i)) $(i).value=params.get(i); });
  if(params.get("newonly")==="1") $("newonly").checked=true;
  const hay=bids.map(b=>`${b.title} ${b.agency} ${b.solicitation_number||""} ${b.description_text||""}`.toLowerCase());
  let shown=[];
  function filter(){
    const q=$("q").value.trim().toLowerCase(), s=$("state").value, n=$("naics").value.trim(), t=$("ntype").value, stt=$("status").value, a=$("aside").value, sr=$("src").value, nw=$("newonly").checked;
    shown=[];
    bids.forEach((b,i)=>{
      if(s && b.state!==s) return; if(t && b.notice_type!==t) return; if(a && b.set_aside!==a) return;
      if(stt && stt!=="any" && (b.status||"open")!==stt) return; if(nw && !b.is_new) return;
      if(sr && !(b.sources||[]).includes(sr)) return;
      if(n && !(b.naics||[]).some(c=>String(c.code).startsWith(n))) return;
      if(q && !hay[i].includes(q)) return;
      shown.push(b);
    });
    if($("sort").value==="due") shown.sort((x,y)=>String(x.due_at||"9").localeCompare(String(y.due_at||"9")));
    else shown.sort((x,y)=>String(y.posted_date||"").localeCompare(String(x.posted_date||"")));
    const p=new URLSearchParams(); ids.forEach(i=>{ if($(i).value) p.set(i,$(i).value); }); if(nw) p.set("newonly","1");
    history.replaceState(null,"","#"+p.toString());
    $("count").textContent=`${shown.length} of ${bids.length} bids${shown.length>300?" (showing the first 300)":""}`;
    const list=$("list");
    if(!bids.length){ list.innerHTML='<div class="empty">No bids collected yet.</div>'; return; }
    if(!shown.length){ list.innerHTML='<div class="empty">No bids match these filters. <button class="ghost" onclick="clearAll()" style="width:auto">Clear filters</button></div>'; return; }
    list.innerHTML=shown.slice(0,300).map(b=>{
      const link=(b.source_links||[])[0]||{};
      return `<div class="bid">
      <a href="${esc(safeUrl(link.listing_url))}" target="_blank" rel="noopener">${esc(b.title)}</a>
      ${b.is_new?'<span class="tag newtag">New</span>':""}
      <div class="meta">${esc(b.agency)} · ${esc(b.state)}${b.county?" · "+esc(b.county):""} · ${esc(b.notice_type||"")}${b.set_aside?" · "+esc(b.set_aside):""}</div>
      <div class="meta">Posted ${esc(b.posted_date||"?")} · Due ${esc(b.due_at||"?")} ${daysLeft(b.due_at)}</div>
      <div>${(b.naics||[]).map(c=>`<span class="tag">${esc(c.code)} ${esc(c.name||"")}</span>`).join("")}${(b.sources||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
      ${detail(b)}</div>`;}).join("");
  }
  window.clearAll=function(){ ids.forEach(i=>$(i).value=""); $("status").value="open"; $("sort").value="posted"; $("newonly").checked=false; filter(); };
  ids.forEach(i=>$(i).addEventListener("input",filter)); $("newonly").addEventListener("change",filter);
  $("clear").onclick=clearAll;
  $("csv").onclick=()=>{
    const cols=["title","agency","state","notice_type","set_aside","posted_date","due_at","naics","listing_url"];
    const val=(b,c)=>c==="naics"?(b.naics||[]).map(x=>x.code).join(" "):c==="listing_url"?((b.source_links||[])[0]||{}).listing_url:b[c];
    const rows=[cols.join(",")].concat(shown.map(b=>cols.map(c=>`"${String(val(b,c)==null?"":val(b,c)).replace(/"/g,'""')}"`).join(",")));
    const el=document.createElement("a"); el.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"})); el.download="gov-bids.csv"; el.click();
  };
  filter();
}

if(!DATA){
  document.body.innerHTML='<header><h1>Gov Bid Engine</h1><p class="err">The page data could not be loaded.</p></header>';
} else {
  const st=DATA.status||{};
  showStatus(st);
  $("list").innerHTML='<div class="empty">Loading bids...</div>';
  fetch(DATA.bids_file,{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(bids=>start(bids,st))
    .catch(()=>{ $("list").innerHTML=`<div class="empty err">The bid list could not be loaded. Last good run: ${fmt((st.last_run||{}).end)}.</div>`; });
}
</script>
</body>
</html>
